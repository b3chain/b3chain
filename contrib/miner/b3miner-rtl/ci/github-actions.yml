# =============================================================================
# LEGACY workflow -- kept for archival reference only.
#
# The active CI for this subtree lives at:
#
#     .github/workflows/b3miner-rtl.yml
#
# That workflow gates push + pull_request on b3chain-main / release/*
# branches and is the only one GitHub Actions auto-runs.  This file is
# now wired to `workflow_dispatch:` only so it never fires automatically;
# it is preserved so external mirrors / forks that historically copied
# this file into their own .github/workflows/ keep working until they
# migrate to the new layout.
#
# DO NOT add new gates here.  Add them to the main workflow file above.
# =============================================================================
name: b3miner-rtl (legacy, manual only)

on:
  workflow_dispatch:

defaults:
  run:
    working-directory: contrib/miner/b3miner-rtl

jobs:
  ref-test:
    name: Python reference
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r ref/requirements.txt
      - name: pytest
        run: make ref-test
      - name: Generate vectors
        run: make vectors
      - name: Upload vectors
        uses: actions/upload-artifact@v4
        with:
          name: vectors
          path: contrib/miner/b3miner-rtl/sim/vectors/
          retention-days: 7

  lint:
    name: Verilator lint
    runs-on: ubuntu-22.04
    needs: ref-test
    steps:
      - uses: actions/checkout@v4
      - name: Install verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator
          verilator --version
      - name: Lint
        run: make lint

  sim:
    name: Verilator simulation
    runs-on: ubuntu-22.04
    needs: [ref-test, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator
          pip install -r ref/requirements.txt
      - name: Sim
        run: make sim

  # Self-hosted runner with Vivado ML Standard, labelled `vivado`.
  # Comment this job out if no such runner is available.
  synth:
    name: Vivado synth + impl
    runs-on: [self-hosted, vivado]
    needs: sim
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Synth + impl + bin
        run: |
          make synth
          make impl
          make bin
          make report
      - name: Upload bitstream
        uses: actions/upload-artifact@v4
        with:
          name: b3miner-bitstream
          path: |
            contrib/miner/b3miner-rtl/build/artifacts/b3miner.bin
            contrib/miner/b3miner-rtl/build/artifacts/b3miner.bit
            contrib/miner/b3miner-rtl/build/reports/summary.txt
          retention-days: 30
