[package]
name = "b3chain-gpuminer"
version = "0.1.0"
edition = "2021"
description = "B3Chain CUDA GPU miner -- BLAKE3(BLAKE3(80-byte header)) on NVIDIA"
license = "MIT"
repository = "https://github.com/b3chain/b3chain"
publish = false

[[bin]]
name = "b3chain-gpuminer"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[features]
# Default builds and links the CUDA kernel via build.rs (requires nvcc on
# PATH or CUDA_PATH set). Disable for `cargo check` on machines without
# CUDA: the binary will refuse to start at runtime instead of failing to
# compile, but the CPU-side stratum + work tests still build.
default = ["cuda"]
cuda = []

[dependencies]
# Async runtime for the Stratum client.
tokio = { version = "1.36", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time", "signal"] }

# CUDA driver bindings. cudarc loads nvcuda.dll at runtime so the binary
# does not statically link against the CUDA toolkit -- it needs only
# the NVIDIA driver to be present on the user's machine.
cudarc = { version = "0.10", default-features = false, features = ["std", "driver", "nvrtc"] }

# Stratum messages.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Hashing: blake3 for the host-side reference (kernel-correctness test);
# sha2 for double_sha256 of the coinbase + merkle branches.
blake3 = "1.5"
sha2 = "0.10"

# Big-int math for target_from_share_difficulty (256-bit divide).
num-bigint = "0.4"
num-traits = "0.2"

# CLI + logging.
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Misc.
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rand = "0.8"

[build-dependencies]
# Run nvcc from build.rs to emit PTX. We do NOT depend on `bindgen_cuda`
# or `cuda_builder` because their feature stacks pin transitive deps that
# fight with cudarc; a 50-line shell-out to nvcc is plenty.
anyhow = "1.0"

[dev-dependencies]
tokio = { version = "1.36", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time", "test-util"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1
