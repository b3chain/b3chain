# B3Chain Live Explorer (explorer-ng) — drop-in nginx site.
#
# Mounts the new explorer at https://explorer.b3chain.org/v2/ alongside the
# existing btc-rpc-explorer (server-default). Once parity is accepted, run
# `install.sh --cutover` which moves /v2/ -> / and demotes the old explorer.
#
# Deployed at /etc/nginx/sites-available/explorer-ng.conf and symlinked into
# /etc/nginx/sites-enabled/. Idempotent: install.sh re-overwrites in place.

# Map for clean upgrade header on /api/v1/ws.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name explorer.b3chain.org;

    # Allow Let's Encrypt renewals; everything else 301s to https.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name explorer.b3chain.org;

    # ------------------------------------------------------------------
    # TLS (managed by certbot; do not edit cert paths here)
    # ------------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/explorer.b3chain.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/explorer.b3chain.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:explorer-ng:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types application/javascript application/json application/wasm
               application/octet-stream text/css text/javascript text/plain
               image/svg+xml;
    gzip_min_length 256;

    # ------------------------------------------------------------------
    # /v2/ — B3Chain Live Explorer (Angular SPA)
    # ------------------------------------------------------------------
    location /v2/ {
        alias /var/www/b3chain-explorer-ng/;
        index index.html;

        # SPA fallback: anything that isn't a real file -> index.html
        try_files $uri $uri/ /v2/index.html;

        location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|wasm)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ------------------------------------------------------------------
    # /resources/* — static assets (config.js, favicons, previews)
    # ------------------------------------------------------------------
    # index.html references /resources/... at the domain root (not under
    # /v2/). Production ng build omits src/resources from the bundle;
    # install.sh copies them here after generate-config.js runs.
    location /resources/ {
        alias /var/www/b3chain-explorer-ng/resources/;
        try_files $uri =404;

        location ~* \.(?:js|css|json|xml|webmanifest|png|jpe?g|gif|ico|svg|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public";
        }
    }

    # ------------------------------------------------------------------
    # /api/* — explorer-ng backend (Node)
    # ------------------------------------------------------------------
    # HttpClient and WebSocket use root-absolute /api/v1/* regardless of
    # <base href="/v2/">. API must be at domain root pre- and post-cutover.
    #
    # ElectrsApiService (block tx list, address lookups, etc.) calls Esplora-
    # style paths like /api/block/:hash/txs/:index without the v1 prefix.
    # We do not run a separate Esplora instance; the mempool backend exposes
    # the same routes under /api/v1/. Rewrite non-v1 /api/* to /api/v1/*.
    location ~ ^/api/(?!v1/)(.*)$ {
        proxy_pass http://127.0.0.1:8999/api/v1/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8999/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # WebSocket upgrade for /api/v1/ws (HTTP/1.1 only; browsers use h1 for ws)
    location = /api/v1/ws {
        proxy_pass http://127.0.0.1:8999/api/v1/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ------------------------------------------------------------------
    # Mempool-style network paths (pre-cutover)
    # ------------------------------------------------------------------
    # Requests like /testnet4 hit location / -> btc-rpc-explorer and 404.
    # B3Chain testnet is served by explorer-ng at /v2/testnet (not testnet4).
    location = /testnet4 {
        return 301 $scheme://$host/v2/testnet;
    }
    location ^~ /testnet4/ {
        rewrite ^/testnet4/?(.*)$ /v2/testnet/$1 permanent;
    }
    location = /testnet {
        return 301 $scheme://$host/v2/testnet;
    }
    location ^~ /testnet/ {
        rewrite ^/testnet/?(.*)$ /v2/testnet/$1 permanent;
    }
    location = /mempool {
        return 301 $scheme://$host/v2/testnet;
    }
    location ~ ^/(signet|regtest)(/|$) {
        return 301 $scheme://$host/v2/testnet;
    }

    # ------------------------------------------------------------------
    # /  — existing btc-rpc-explorer fallback (untouched until --cutover)
    # ------------------------------------------------------------------
    # We MUST own the / location here, even though there is a separate
    # /etc/nginx/sites-available/explorer.b3chain.org file that also
    # binds server_name "explorer.b3chain.org". When two server blocks
    # claim the same listen+server_name, nginx picks the FIRST one
    # alphabetically loaded — and "explorer-ng.conf" loads before
    # "explorer.b3chain.org" because '-' sorts before '.'. Without an
    # explicit location / here, requests to / fall through to nginx's
    # compiled default and serve "/usr/share/nginx/html/index.html"
    # ("Welcome to nginx!"). Proxy to btc-rpc-explorer on :3002 to keep
    # the old explorer reachable at / until --cutover swaps roles.
    # @cutover-pre-begin (install.sh --cutover removes everything between
    # @cutover-pre-begin and @cutover-pre-end before renaming /v2/ to /)
    location / {
        proxy_pass         http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    # @cutover-pre-end
}
