# Appended via /etc/b3chain/conf.d/zmq.conf by install.sh --enable-zmq.
# These pubs are required by the explorer-ng backend's pending-pool engine
# (P2). Bind to 127.0.0.1 only; never expose to the network.

zmqpubrawtx=tcp://127.0.0.1:28332
zmqpubrawblock=tcp://127.0.0.1:28333
zmqpubhashtx=tcp://127.0.0.1:28334
zmqpubhashblock=tcp://127.0.0.1:28335
zmqpubsequence=tcp://127.0.0.1:28336
