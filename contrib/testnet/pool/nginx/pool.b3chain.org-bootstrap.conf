# Bootstrap vhost for pool.b3chain.org used during initial provisioning.
#
# This file is installed by install.sh BEFORE certbot has issued a TLS
# certificate. Once `certbot certonly --webroot -w /var/www/b3chain
# -d pool.b3chain.org` succeeds, install.sh replaces this file with
# pool.b3chain.org.conf (the full HTTPS vhost) and reloads nginx.
#
# Webroot is /var/www/b3chain to match the convention already used by
# the existing b3chain.org / explorer.b3chain.org / faucet.b3chain.org
# vhosts on seed1 -- one ACME-challenge directory shared by all
# *.b3chain.org subdomains.

server {
    listen 80;
    listen [::]:80;
    server_name pool.b3chain.org;

    location /.well-known/acme-challenge/ {
        root /var/www/b3chain;
    }

    # Stratum V2 cert + authority pubkey: served over plain HTTP because
    # the cert itself is Ed25519-signed (see contrib/testnet/pool/docs/
    # NOISE-KEYS.md). Available even before TLS is provisioned.
    location ^~ /sv2/ {
        alias /var/www/b3chain/sv2/;
        default_type application/octet-stream;
        autoindex off;
        access_log off;
    }

    # Until TLS is configured, serve the pool over plain HTTP so the
    # site is reachable for smoke testing right after install. The
    # full vhost will replace this with a 301 redirect to HTTPS.
    location / {
        proxy_pass http://127.0.0.1:5100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
    }
}
