; B3Chain testnet status-monitor configuration.
;
; Copy to /etc/b3chain-status.conf on seed1 (or pass --config to the
; script). All values shown are defaults; only the [node] credentials
; are strictly required.

[node]
; b3chaind JSON-RPC connection. Reads testnet (`-chain=test`) state.
rpchost = 127.0.0.1
rpcport = 18534
rpcuser = b3chain
; Either set rpcpassword inline, or point rpcpassword_file at a file
; that contains the password (preferred — keep secrets out of /etc).
rpcpassword =
rpcpassword_file = /etc/b3chain/rpcpassword
; Reported back in the JSON; should match -chain= the node was started with.
chain = test

[pool]
; The reference pool stack (contrib/testnet/pool/) exposes two
; localhost-only endpoints we read:
;
;  * Stratum server: GET /stats on the stratum process's sibling HTTP
;    port (defaults to 127.0.0.1:3334, see
;    contrib/testnet/pool/src/stratum/main.ts), returns:
;      { miners, hashrate, lastJobHeight }
;
;  * Web service: GET /metrics on the web process (defaults to
;    127.0.0.1:5100, see contrib/testnet/pool/src/web/routes/metrics.ts),
;    Prometheus text format with b3chain_pool_* counters/gauges.
;
; Either or both may be blank; missing endpoints simply leave the
; corresponding pool fields null in the output JSON.
stratum_stats_url = http://127.0.0.1:3334/stats
web_metrics_url   = http://127.0.0.1:5100/metrics

; Publicly advertised Stratum URL that the website renders.
public_url = stratum+tcp://pool.b3chain.org:3333

[faucet]
; The reference faucet (contrib/testnet/faucet/app.py) exposes /status
; as JSON. Point at the localhost listener (it is reverse-proxied to
; faucet.b3chain.org via nginx in production).
status_url = http://127.0.0.1:5000/status

[output]
; Where to write the JSON document. Defaults to the nginx-served path
; on seed1, which is reachable at https://b3chain.org/testnet-status.json
path = /var/www/b3chain/testnet-status.json
